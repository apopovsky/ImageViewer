[package]
name = "image-viewer"
version = "0.1.0"
edition = "2021"
description = "Fast image and video viewer and editor for Windows"

[[bin]]
name = "ImageViewer"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
image = { version = "0.25", default-features = true }
resvg = "0.44"
kamadak-exif = "0.5"
rayon = "1.10"
crossbeam-channel = "0.5"
rfd = "0.15"
arboard = "3.4"
trash = "5.1"
winreg = "0.52"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
